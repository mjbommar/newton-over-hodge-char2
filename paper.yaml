paper:
  title: Newton over Hodge at $p = 2$ for $2$-power-order characters on arbitrary smooth affine curves
  subtitle: ''
  short_title: Newton over Hodge at p = 2
  # LaTeX-free mirror for PDF metadata and for arXiv's plain-text fields
  # (hyperref cannot typeset math in a PDF string; without this the /Title
  # that arXiv and indexers surface comes out with the math deleted).
  title_plain: Newton over Hodge at p = 2 for 2-power-order characters on arbitrary smooth affine curves
  date: ''
authors:
- name: Michael Bommarito
  email: michael.bommarito@gmail.com
  alt_email: mike@273ventures.com
  corresponding: true
abstract: 'Newton-over-Hodge lower bounds for Artin--Schreier--Witt $L$-functions on arbitrary smooth affine curves are
  known only for odd $p$: at $p = 2$ the Kramer-Miller--Upton local estimate degrades to $a(k) = \lfloor
  (k-1)/3 \rfloor$, which they call too low for applications to the global setting. We show that this is an
  artifact of one weight choice, not of the prime. The $3$ is the tame ramification index of an auxiliary
  Belyi map, and the weight $a(k) = \lfloor (k-1)/3 \rfloor + (k \bmod 2)$ is admissible for every $k$, with
  defect $d(k) \ge \max(1, k/6)$; the rate $1/6$ is exactly optimal, since $k = 2e$ is a self-loop of the
  local operator with coefficient $2$ for every weight. Adding a characteristic-$2$ tame Belyi map of uniform
  index $3$ over the point $1$, we obtain $\mathrm{NP}_q(L(\rho,s)) \ge \mathrm{HP}_q(\rho)$ as full polygons,
  with no truncation, for every nontrivial character of $2$-power order on a smooth affine curve over
  $\mathbf{F}_{2^a}$. We also give the local-to-global contact criterion at $p = 2$ on an initial segment,
  prove that restriction structural, and record corrections to the literature.'
abstract_plain: 'Newton-over-Hodge lower bounds for Artin-Schreier-Witt L-functions on arbitrary smooth affine curves are
  known only for odd p: at p = 2 the Kramer-Miller-Upton local estimate degrades to a(k) = floor((k-1)/3),
  which they call too low for applications to the global setting. We show that this is an artifact of one
  weight choice, not of the prime. The 3 is the tame ramification index of an auxiliary Belyi map, and the
  weight a(k) = floor((k-1)/3) + (k mod 2) is admissible for every k, with defect d(k) >= max(1, k/6); the
  rate 1/6 is exactly optimal, since k = 2e is a self-loop of the local operator with coefficient 2 for every
  weight. Adding a characteristic-2 tame Belyi map of uniform index 3 over the point 1, we obtain
  NP_q(L(rho,s)) >= HP_q(rho) as full polygons, with no truncation, for every nontrivial character of 2-power
  order on a smooth affine curve over F_{2^a}. We also give the local-to-global contact criterion at p = 2 on
  an initial segment, prove that restriction structural, and record corrections to the literature.'
